<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校園失物招領 - 後台管理</title>
<style>
  body {
    font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 24px;
    color: #222;
  }
  h1 { margin-bottom: 4px; }
  .auth-bar {
    background: #edf2f7;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 12px 16px;
    margin: 12px 0 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .auth-bar input { flex: 1; min-width: 200px; }
  .toolbar {
    margin: 16px 0;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  select, input[type="text"], input[type="password"], button {
    padding: 8px 12px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }
  input[type="text"] { width: 200px; }
  button {
    background: #2b6cb0;
    color: white;
    border: none;
    cursor: pointer;
  }
  button:hover { background: #1e4e8c; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid #eee;
    font-size: 14px;
    vertical-align: middle;
  }
  th { background: #2b6cb0; color: white; }
  img.thumb {
    width: 48px; height: 48px;
    object-fit: cover; border-radius: 4px;
  }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    color: white;
  }
  .tag.found { background: #38a169; }
  .tag.lost { background: #dd6b20; }
  .status-pending { color: #c53030; font-weight: bold; }
  .status-open { color: #2b6cb0; font-weight: bold; }
  .status-closed { color: #718096; }
  .status-rejected { color: #a0aec0; text-decoration: line-through; }
  .approve-btn { background: #38a169; }
  .approve-btn:hover { background: #2f855a; }
  .reject-btn { background: #c53030; }
  .reject-btn:hover { background: #9b2c2c; }
  .pending-badge {
    display: inline-block;
    background: #c53030;
    color: white;
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 12px;
    margin-left: 8px;
  }
  .action-btn { padding: 4px 8px; font-size: 12px; margin-right: 4px; }
  .detail-btn { background: #6b46c1; }
  .detail-btn:hover { background: #553c9a; }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: white;
    border-radius: 10px;
    padding: 24px;
    max-width: 560px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .modal-close {
    background: none; border: none; font-size: 20px;
    cursor: pointer; color: #718096; padding: 0;
  }
  .source-item, .rank-item {
    display: flex; gap: 12px; padding: 12px;
    border-radius: 8px; margin-bottom: 10px; align-items: center;
  }
  .source-item { background: #f7fafc; margin-bottom: 16px; }
  .rank-item { border: 1px solid #edf2f7; }
  .source-item img, .rank-item img {
    width: 56px; height: 56px; object-fit: cover; border-radius: 6px; flex-shrink: 0;
  }
  .rank-number {
    font-size: 18px; font-weight: bold; color: #a0aec0;
    width: 28px; text-align: center; flex-shrink: 0;
  }
  .rank-number.top1 { color: #d69e2e; }
  .rank-info { font-size: 13px; flex: 1; }
  .similarity-bar-bg {
    background: #edf2f7; border-radius: 4px; height: 6px;
    margin-top: 6px; overflow: hidden; flex: 1;
  }
  .similarity-bar-fill { background: #2b6cb0; height: 100%; }
  .similarity-text {
    font-size: 12px; color: #2b6cb0; font-weight: bold; margin-left: 8px;
  }
  #loading { color: #888; margin: 16px 0; }
  .muted { color: #aaa; }
</style>
</head>
<body>

<h1>校園失物招領 - 後台管理 <span id="pendingBadge"></span></h1>

<div class="auth-bar">
  <label for="adminKeyInput">管理金鑰</label>
  <input type="password" id="adminKeyInput" placeholder="對應 .env 的 ADMIN_API_KEY" autocomplete="off">
  <button type="button" onclick="saveAdminKey()">儲存並載入</button>
  <button type="button" onclick="clearAdminKey()" style="background:#718096;">清除</button>
</div>

<p id="loading">請先設定管理金鑰…</p>

<div class="toolbar">
  <label>關鍵字:
    <input type="text" id="searchInput" placeholder="搜尋地點或描述…" oninput="filterLocalItems()">
  </label>
  <label>類型:
    <select id="filterType" onchange="loadItems()">
      <option value="">全部</option>
      <option value="found">拾獲</option>
      <option value="lost">遺失</option>
    </select>
  </label>
  <label>物品分類:
    <select id="filterCategory" onchange="loadItems()">
      <option value="">全部</option>
      <option value="3C產品">3C 產品</option>
      <option value="證件">證件</option>
      <option value="衣物">衣物</option>
      <option value="文具">文具</option>
      <option value="水壺/餐具">水壺 / 餐具</option>
      <option value="鑰匙">鑰匙</option>
      <option value="其他">其他</option>
    </select>
  </label>
  <label>狀態:
    <select id="filterStatus" onchange="loadItems()">
      <option value="">全部</option>
      <option value="pending">待審核</option>
      <option value="open">比對中</option>
      <option value="closed">已結案</option>
      <option value="rejected">已拒絕</option>
    </select>
  </label>
  <button type="button" onclick="loadItems()">重新整理</button>
</div>

<table id="itemsTable" style="display:none;">
  <thead>
    <tr>
      <th>照片</th>
      <th>類型</th>
      <th>分類</th>
      <th>地點</th>
      <th>描述</th>
      <th>通報人</th>
      <th>學號</th>
      <th>保管處</th>
      <th>狀態</th>
      <th>建立時間</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody id="itemsBody"></tbody>
</table>

<div class="modal-overlay" id="detailModal" onclick="if(event.target === this) closeDetail()">
  <div class="modal-box">
    <div class="modal-header">
      <h2 style="margin:0;font-size:16px;">AI 比對詳情</h2>
      <button type="button" class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div id="detailContent">載入中…</div>
  </div>
</div>

<script>
  // 與 API 同源時留空即可；分開部署再改成完整網址
  const API_BASE = "";
  const KEY_STORAGE = "lostfound_admin_key";

  let rawItemsList = [];
  let itemsCache = {};

  function safeUrl(url) {
    if (!url || typeof url !== "string") return "";
    try {
      const u = new URL(url, window.location.origin);
      if (u.protocol === "http:" || u.protocol === "https:") return u.href;
    } catch (_) {}
    return "";
  }

  function getAdminKey() {
    return localStorage.getItem(KEY_STORAGE) || "";
  }

  function saveAdminKey() {
    const key = document.getElementById("adminKeyInput").value.trim();
    if (!key) {
      alert("請輸入管理金鑰");
      return;
    }
    localStorage.setItem(KEY_STORAGE, key);
    loadItems();
  }

  function clearAdminKey() {
    localStorage.removeItem(KEY_STORAGE);
    document.getElementById("adminKeyInput").value = "";
    document.getElementById("loading").textContent = "請先設定管理金鑰…";
    document.getElementById("itemsTable").style.display = "none";
  }

  function adminHeaders(extra = {}) {
    const key = getAdminKey();
    return { "X-Admin-Key": key, ...extra };
  }

  async function adminFetch(url, options = {}) {
    const headers = { ...adminHeaders(), ...(options.headers || {}) };
    const res = await fetch(url, { ...options, headers });
    let data = null;
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) {
      const detail = data && (data.detail || data.error || data.message);
      throw new Error(typeof detail === "string" ? detail : `HTTP ${res.status}`);
    }
    return data;
  }

  async function loadItems() {
    if (!getAdminKey()) {
      document.getElementById("loading").textContent = "請先設定管理金鑰…";
      document.getElementById("itemsTable").style.display = "none";
      return;
    }

    const type = document.getElementById("filterType").value;
    const status = document.getElementById("filterStatus").value;
    const category = document.getElementById("filterCategory").value;
    const params = new URLSearchParams();
    if (type) params.append("type", type);
    if (status) params.append("status", status);
    if (category) params.append("category", category);

    const loadingEl = document.getElementById("loading");
    const tableEl = document.getElementById("itemsTable");
    loadingEl.style.display = "block";
    loadingEl.textContent = "載入中…";
    tableEl.style.display = "none";

    try {
      const data = await adminFetch(`${API_BASE}/admin/items?${params}`);
      rawItemsList = data.items || [];
      itemsCache = {};
      for (const item of rawItemsList) itemsCache[item.id] = item;
      filterLocalItems();
      updatePendingBadge();
      loadingEl.style.display = "none";
      tableEl.style.display = "table";
    } catch (err) {
      loadingEl.textContent = "載入失敗：" + err.message;
    }
  }

  function filterLocalItems() {
    const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
    let filtered = rawItemsList;
    if (keyword) {
      filtered = rawItemsList.filter(item =>
        (item.location && item.location.toLowerCase().includes(keyword)) ||
        (item.description && item.description.toLowerCase().includes(keyword))
      );
    }
    renderItems(filtered);
  }

  function renderItems(items) {
    const tbody = document.getElementById("itemsBody");
    tbody.replaceChildren();

    if (items.length === 0) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 8;
      td.style.textAlign = "center";
      td.style.color = "#888";
      td.textContent = "目前沒有符合條件的物品";
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }

    for (const item of items) {
      const tr = document.createElement("tr");
      tr.dataset.itemId = item.id;
      tbody.appendChild(tr);
      fillRow(tr, item);
    }
  }

  function fillRow(tr, item) {
    tr.replaceChildren();
    const typeLabel = item.type === "found" ? "拾獲" : "遺失";
    const typeClass = item.type === "found" ? "found" : "lost";
    const statusLabel = {
      pending: "待審核", open: "比對中", closed: "已結案", rejected: "已拒絕",
    }[item.status] || item.status;

    const photoTd = document.createElement("td");
    const imgUrl = safeUrl(item.image_url);
    if (imgUrl) {
      const img = document.createElement("img");
      img.className = "thumb";
      img.src = imgUrl;
      img.alt = "";
      img.onerror = () => { img.style.display = "none"; };
      photoTd.appendChild(img);
    } else {
      photoTd.textContent = "-";
    }

    const typeTd = document.createElement("td");
    const tag = document.createElement("span");
    tag.className = "tag " + typeClass;
    tag.textContent = typeLabel;
    typeTd.appendChild(tag);

    const cells = [
      photoTd,
      typeTd,
      textCell(item.category || "-"),
      textCell(item.location || "-"),
      textCell(item.description || "-"),
      textCell(item.line_user_id || "-"),
      textCell(item.student_id || "-"),
      textCell(item.custodian || "-"),
    ];

    const statusTd = document.createElement("td");
    statusTd.className = "status-" + (item.status || "");
    statusTd.textContent = statusLabel;
    cells.push(statusTd);
    cells.push(textCell(formatDate(item.created_at)));

    const actionTd = document.createElement("td");
    if (item.status === "pending") {
      actionTd.appendChild(makeBtn("審核通過", "action-btn approve-btn", () => approveItem(item.id)));
      actionTd.appendChild(makeBtn("拒絕", "action-btn reject-btn", () => rejectItem(item.id)));
    } else if (item.status === "open") {
      actionTd.appendChild(makeBtn("查看詳情", "action-btn detail-btn", () => showDetail(item.id)));
      actionTd.appendChild(makeBtn("標記結案", "action-btn", () => updateStatus(item.id, "closed")));
    } else {
      const span = document.createElement("span");
      span.className = "muted";
      span.textContent = "-";
      actionTd.appendChild(span);
    }
    cells.push(actionTd);

    for (const cell of cells) tr.appendChild(cell);
  }

  function textCell(text) {
    const td = document.createElement("td");
    td.textContent = text;
    return td;
  }

  function makeBtn(label, className, onClick) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = className;
    btn.textContent = label;
    btn.addEventListener("click", onClick);
    return btn;
  }

  function formatDate(isoStr) {
    if (!isoStr) return "-";
    return new Date(isoStr).toLocaleString("zh-TW", { hour12: false });
  }

  async function showDetail(itemId) {
    const modal = document.getElementById("detailModal");
    const content = document.getElementById("detailContent");
    modal.classList.add("show");
    content.textContent = "載入中…";

    try {
      const sourceItem = itemsCache[itemId];
      const data = await adminFetch(`${API_BASE}/items/${itemId}/matches`);
      const matches = data.matches || [];
      content.replaceChildren();

      if (sourceItem) {
        const box = document.createElement("div");
        box.className = "source-item";
        const imgUrl = safeUrl(sourceItem.image_url);
        if (imgUrl) {
          const img = document.createElement("img");
          img.src = imgUrl;
          img.alt = "";
          img.onerror = () => { img.style.display = "none"; };
          box.appendChild(img);
        }
        const info = document.createElement("div");
        info.style.fontSize = "13px";
        const title = document.createElement("div");
        const strong = document.createElement("strong");
        strong.textContent = (sourceItem.type === "found" ? "拾獲" : "遺失") + "物品";
        title.appendChild(strong);
        title.appendChild(document.createTextNode(" ・ " + (sourceItem.category || "-")));
        const sub = document.createElement("div");
        sub.style.color = "#718096";
        sub.style.marginTop = "2px";
        sub.textContent = `${sourceItem.location || "-"} ・ ${sourceItem.description || "無描述"}`;
        info.appendChild(title);
        info.appendChild(sub);
        box.appendChild(info);
        content.appendChild(box);
      }

      if (matches.length === 0) {
        const p = document.createElement("p");
        p.style.cssText = "color:#718096;font-size:13px;text-align:center;padding:16px 0;";
        p.textContent = "目前 AI 尚未比對出任何相符物品";
        content.appendChild(p);
        return;
      }

      const heading = document.createElement("p");
      heading.style.cssText = "font-size:13px;font-weight:bold;margin-bottom:10px;";
      heading.textContent = `AI 比對排序（共 ${matches.length} 筆，依相似度排列）`;
      content.appendChild(heading);

      matches.forEach((m, index) => {
        const rank = index + 1;
        const pct = (m.similarity * 100).toFixed(1);
        const row = document.createElement("div");
        row.className = "rank-item";

        const num = document.createElement("div");
        num.className = "rank-number" + (rank === 1 ? " top1" : "");
        num.textContent = "#" + rank;
        row.appendChild(num);

        const imgUrl = safeUrl(m.image_url);
        if (imgUrl) {
          const img = document.createElement("img");
          img.src = imgUrl;
          img.alt = "";
          img.onerror = () => { img.style.display = "none"; };
          row.appendChild(img);
        }

        const info = document.createElement("div");
        info.className = "rank-info";
        const line1 = document.createElement("div");
        const strong = document.createElement("strong");
        strong.textContent = m.category || "-";
        line1.appendChild(strong);
        line1.appendChild(document.createTextNode(" ・ " + (m.location || "-")));
        const line2 = document.createElement("div");
        line2.style.color = "#718096";
        line2.textContent = m.description || "無描述";
        const barWrap = document.createElement("div");
        barWrap.style.display = "flex";
        barWrap.style.alignItems = "center";
        const barBg = document.createElement("div");
        barBg.className = "similarity-bar-bg";
        const barFill = document.createElement("div");
        barFill.className = "similarity-bar-fill";
        barFill.style.width = pct + "%";
        barBg.appendChild(barFill);
        const pctText = document.createElement("span");
        pctText.className = "similarity-text";
        pctText.textContent = pct + "%";
        barWrap.appendChild(barBg);
        barWrap.appendChild(pctText);
        info.appendChild(line1);
        info.appendChild(line2);
        info.appendChild(barWrap);
        row.appendChild(info);
        content.appendChild(row);
      });
    } catch (err) {
      content.textContent = "載入失敗：" + err.message;
    }
  }

  function closeDetail() {
    document.getElementById("detailModal").classList.remove("show");
  }

  async function approveItem(itemId) {
    if (!confirm("確定審核通過這筆物品嗎？通過後會公開讓使用者搜尋比對。")) return;
    await callActionApi(itemId, `${API_BASE}/items/${itemId}/approve`, "open");
  }

  async function rejectItem(itemId) {
    if (!confirm("確定要拒絕這筆物品嗎？")) return;
    await callActionApi(itemId, `${API_BASE}/items/${itemId}/reject`, "rejected");
  }

  async function callActionApi(itemId, url, newStatus) {
    const tr = document.querySelector(`tr[data-item-id="${CSS.escape(itemId)}"]`);
    const actionCell = tr ? tr.querySelector("td:last-child") : null;
    if (actionCell) {
      actionCell.replaceChildren();
      const span = document.createElement("span");
      span.className = "muted";
      span.textContent = "處理中…";
      actionCell.appendChild(span);
    }

    try {
      await adminFetch(url, { method: "POST" });
      const currentFilter = document.getElementById("filterStatus").value;
      if (currentFilter === "pending" && tr) {
        tr.remove();
        delete itemsCache[itemId];
        rawItemsList = rawItemsList.filter(i => i.id !== itemId);
        updatePendingBadge();
        if (Object.keys(itemsCache).length === 0) renderItems([]);
      } else if (itemsCache[itemId] && tr) {
        itemsCache[itemId].status = newStatus;
        fillRow(tr, itemsCache[itemId]);
        updatePendingBadge();
      }
    } catch (err) {
      alert("操作失敗：" + err.message);
      if (tr && itemsCache[itemId]) fillRow(tr, itemsCache[itemId]);
    }
  }

  function updatePendingBadge() {
    const badge = document.getElementById("pendingBadge");
    const count = Object.values(itemsCache).filter(i => i.status === "pending").length;
    badge.textContent = count > 0 ? `${count} 筆待審核` : "";
    badge.className = count > 0 ? "pending-badge" : "";
  }

  async function updateStatus(itemId, newStatus) {
    if (!confirm("確定要將這筆物品標記為已結案嗎？")) return;
    const tr = document.querySelector(`tr[data-item-id="${CSS.escape(itemId)}"]`);
    const actionCell = tr ? tr.querySelector("td:last-child") : null;
    if (actionCell) {
      actionCell.replaceChildren();
      const span = document.createElement("span");
      span.className = "muted";
      span.textContent = "更新中…";
      actionCell.appendChild(span);
    }

    const formData = new FormData();
    formData.append("status", newStatus);

    try {
      await adminFetch(`${API_BASE}/items/${itemId}`, { method: "PATCH", body: formData });
      if (itemsCache[itemId]) {
        itemsCache[itemId].status = newStatus;
        if (tr) fillRow(tr, itemsCache[itemId]);
      } else {
        loadItems();
      }
    } catch (err) {
      alert("更新失敗：" + err.message);
      if (tr && itemsCache[itemId]) fillRow(tr, itemsCache[itemId]);
    }
  }

  document.getElementById("adminKeyInput").value = getAdminKey();
  if (getAdminKey()) loadItems();
</script>
</body>
</html>
