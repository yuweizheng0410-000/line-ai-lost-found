<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>校園失物招領 - 後台管理</title>
<style>
  body {
    font-family: "Microsoft JhengHei", sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 24px;
    color: #222;
  }
  h1 {
    margin-bottom: 4px;
  }
  .toolbar {
    margin: 16px 0;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  select, input[type="text"], button {
    padding: 8px 12px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }
  input[type="text"] {
    width: 200px;
  }
  button {
    background: #2b6cb0;
    color: white;
    border: none;
    cursor: pointer;
  }
  button:hover {
    background: #1e4e8c;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  th {
    background: #2b6cb0;
    color: white;
  }
  img.thumb {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 4px;
  }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    color: white;
  }
  .tag.found { background: #38a169; }
  .tag.lost { background: #dd6b20; }
  .status-pending { color: #c53030; font-weight: bold; }
  .status-open { color: #2b6cb0; font-weight: bold; }
  .status-closed { color: #718096; }
  .status-rejected { color: #a0aec0; text-decoration: line-through; }
  .approve-btn { background: #38a169; }
  .approve-btn:hover { background: #2f855a; }
  .reject-btn { background: #c53030; }
  .reject-btn:hover { background: #9b2c2c; }
  .pending-badge {
    display: inline-block;
    background: #c53030;
    color: white;
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 12px;
    margin-left: 8px;
  }
  .action-btn {
    padding: 4px 8px;
    font-size: 12px;
    margin-right: 4px;
  }
  .detail-btn { background: #6b46c1; }
  .detail-btn:hover { background: #553c9a; }

  /* 詳情彈窗:顯示 AI 比對排序結果 */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: white;
    border-radius: 10px;
    padding: 24px;
    max-width: 560px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .modal-close {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #718096;
    padding: 0;
  }
  .source-item {
    display: flex;
    gap: 12px;
    padding: 12px;
    background: #f7fafc;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .source-item img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 6px;
  }
  .rank-item {
    display: flex;
    gap: 12px;
    padding: 12px;
    border: 1px solid #edf2f7;
    border-radius: 8px;
    margin-bottom: 10px;
    align-items: center;
  }
  .rank-number {
    font-size: 18px;
    font-weight: bold;
    color: #a0aec0;
    width: 28px;
    text-align: center;
    flex-shrink: 0;
  }
  .rank-number.top1 { color: #d69e2e; }
  .rank-item img {
    width: 56px;
    height: 56px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .rank-info { font-size: 13px; flex: 1; }
  .similarity-bar-bg {
    background: #edf2f7;
    border-radius: 4px;
    height: 6px;
    margin-top: 6px;
    overflow: hidden;
  }
  .similarity-bar-fill {
    background: #2b6cb0;
    height: 100%;
  }
  .similarity-text {
    font-size: 12px;
    color: #2b6cb0;
    font-weight: bold;
    margin-left: 8px;
  }
  #loading { color: #888; margin: 16px 0; }
</style>
</head>
<body>

<h1>校園失物招領 - 後台管理 <span id="pendingBadge"></span></h1>
<p id="loading">載入中...</p>

<div class="toolbar">
  <label>關鍵字:
    <input type="text" id="searchInput" placeholder="搜尋地點或描述..." oninput="filterLocalItems()">
  </label>
  <label>類型:
    <select id="filterType" onchange="loadItems()">
      <option value="">全部</option>
      <option value="found">拾獲</option>
      <option value="lost">遺失</option>
    </select>
  </label>
  <label>物品分類:
    <select id="filterCategory" onchange="loadItems()">
      <option value="">全部</option>
      <option value="3C產品">3C 產品</option>
      <option value="證件">證件</option>
      <option value="衣物">衣物</option>
      <option value="文具">文具</option>
      <option value="水壺/餐具">水壺 / 餐具</option>
      <option value="鑰匙">鑰匙</option>
      <option value="其他">其他</option>
    </select>
  </label>
  <label>狀態:
    <select id="filterStatus" onchange="loadItems()">
      <option value="pending">待審核</option>
      <option value="">全部</option>
      <option value="open">比對中</option>
      <option value="closed">已結案</option>
      <option value="rejected">已拒絕</option>
    </select>
  </label>
  <button onclick="loadItems()">重新整理</button>
</div>

<table id="itemsTable" style="display:none;">
  <thead>
    <tr>
      <th>照片</th>
      <th>類型</th>
      <th>分類</th>
      <th>地點</th>
      <th>描述</th>
      <th>狀態</th>
      <th>建立時間</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody id="itemsBody"></tbody>
</table>

<script>
  // 如果你的 API 不是跑在本機 8000 埠,改這裡
  const API_BASE = "http://127.0.0.1:8000";

  // rawItemsList:從後端拿到、經過 type/category/status 篩選後的清單(還沒套用關鍵字搜尋)
  // itemsCache:以 id 為 key 的查表,方便單筆更新畫面時查詢
  let rawItemsList = [];
  let itemsCache = {};

  async function loadItems() {
    const type = document.getElementById("filterType").value;
    const status = document.getElementById("filterStatus").value;
    const category = document.getElementById("filterCategory").value;

    const params = new URLSearchParams();
    if (type) params.append("type", type);
    if (status) params.append("status", status);
    if (category) params.append("category", category);

    const loadingEl = document.getElementById("loading");
    const tableEl = document.getElementById("itemsTable");
    loadingEl.style.display = "block";
    tableEl.style.display = "none";

    try {
      const res = await fetch(`${API_BASE}/items?${params.toString()}`);
      const data = await res.json();
      rawItemsList = data.items || [];

      itemsCache = {};
      for (const item of rawItemsList) itemsCache[item.id] = item;

      // 重新載入後,關鍵字搜尋欄位的篩選也要重新套用一次
      filterLocalItems();
      updatePendingBadge();
      loadingEl.style.display = "none";
      tableEl.style.display = "table";
    } catch (err) {
      loadingEl.textContent = "載入失敗,請確認 API 伺服器是否正在執行(" + err.message + ")";
    }
  }

  // 在已經從後端拿到的 rawItemsList 裡,依關鍵字即時篩選地點/描述,不用重新打 API
  function filterLocalItems() {
    const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
    let filtered = rawItemsList;

    if (keyword) {
      filtered = rawItemsList.filter(item =>
        (item.location && item.location.toLowerCase().includes(keyword)) ||
        (item.description && item.description.toLowerCase().includes(keyword))
      );
    }

    renderItems(filtered);
  }

  function renderItems(items) {
    const tbody = document.getElementById("itemsBody");
    tbody.innerHTML = "";

    if (items.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:#888;">目前沒有符合條件的物品</td></tr>`;
      return;
    }

    for (const item of items) {
      const tr = document.createElement("tr");
      tr.setAttribute("data-item-id", item.id);
      tbody.appendChild(tr);
      fillRow(tr, item);
    }
  }

  // 把單一 <tr> 的內容,依 item 資料填好(新增列、或更新列都共用這個函式)
  function fillRow(tr, item) {
    const typeLabel = item.type === "found" ? "拾獲" : "遺失";
    const typeClass = item.type === "found" ? "found" : "lost";
    const statusLabel = {
      pending: "待審核",
      open: "比對中",
      closed: "已結案",
      rejected: "已拒絕",
    }[item.status] || item.status;
    const statusClass = "status-" + item.status;

    let actionHtml = "";
    if (item.status === "pending") {
      actionHtml = `
        <button class="action-btn approve-btn" onclick="approveItem('${item.id}')">審核通過</button>
        <button class="action-btn reject-btn" onclick="rejectItem('${item.id}')">拒絕</button>
      `;
    } else if (item.status === "open") {
      actionHtml = `
        <button class="action-btn detail-btn" onclick="showDetail('${item.id}')">查看詳情</button>
        <button class="action-btn" onclick="updateStatus('${item.id}', 'closed')">標記結案</button>
      `;
    } else {
      actionHtml = `<span style="color:#aaa;">-</span>`;
    }

    tr.innerHTML = `
      <td>${item.image_url ? `<img class="thumb" src="${item.image_url}" onerror="this.style.display='none'">` : "-"}</td>
      <td><span class="tag ${typeClass}">${typeLabel}</span></td>
      <td>${item.category || "-"}</td>
      <td>${item.location || "-"}</td>
      <td>${item.description || "-"}</td>
      <td class="${statusClass}">${statusLabel}</td>
      <td>${formatDate(item.created_at)}</td>
      <td>${actionHtml}</td>
    `;
  }

  function formatDate(isoStr) {
    if (!isoStr) return "-";
    const d = new Date(isoStr);
    return d.toLocaleString("zh-TW", { hour12: false });
  }

  // 查看詳情:呼叫既有的 matches API,顯示這筆物品的 AI 比對排序結果
  async function showDetail(itemId) {
    const modal = document.getElementById("detailModal");
    const content = document.getElementById("detailContent");
    modal.classList.add("show");
    content.innerHTML = `<p style="color:#718096;font-size:13px;">載入中...</p>`;

    try {
      const sourceItem = itemsCache[itemId];

      const res = await fetch(`${API_BASE}/items/${itemId}/matches`);
      const data = await res.json();
      const matches = data.matches || [];

      let html = "";

      // 上方顯示這筆物品本身(比對的來源)
      if (sourceItem) {
        const typeLabel = sourceItem.type === "found" ? "拾獲" : "遺失";
        html += `
          <div class="source-item">
            ${sourceItem.image_url ? `<img src="${sourceItem.image_url}" onerror="this.style.display='none'">` : ""}
            <div style="font-size:13px;">
              <div><strong>${typeLabel}物品</strong> ・ ${sourceItem.category || "-"}</div>
              <div style="color:#718096;margin-top:2px;">${sourceItem.location || "-"} ・ ${sourceItem.description || "無描述"}</div>
            </div>
          </div>
        `;
      }

      if (matches.length === 0) {
        html += `<p style="color:#718096;font-size:13px;text-align:center;padding:16px 0;">目前 AI 尚未比對出任何相符物品</p>`;
      } else {
        html += `<p style="font-size:13px;font-weight:bold;margin-bottom:10px;">AI 比對排序(共 ${matches.length} 筆,依相似度排列)</p>`;
        matches.forEach((m, index) => {
          const rank = index + 1;
          const similarityPercent = (m.similarity * 100).toFixed(1);
          html += `
            <div class="rank-item">
              <div class="rank-number ${rank === 1 ? 'top1' : ''}">#${rank}</div>
              ${m.image_url ? `<img src="${m.image_url}" onerror="this.style.display='none'">` : ""}
              <div class="rank-info">
                <div><strong>${m.category || "-"}</strong> ・ ${m.location || "-"}</div>
                <div style="color:#718096;">${m.description || "無描述"}</div>
                <div style="display:flex;align-items:center;">
                  <div class="similarity-bar-bg" style="flex:1;">
                    <div class="similarity-bar-fill" style="width:${similarityPercent}%;"></div>
                  </div>
                  <span class="similarity-text">${similarityPercent}%</span>
                </div>
              </div>
            </div>
          `;
        });
      }

      content.innerHTML = html;
    } catch (err) {
      content.innerHTML = `<p style="color:#c53030;font-size:13px;">載入失敗: ${err.message}</p>`;
    }
  }

  function closeDetail() {
    document.getElementById("detailModal").classList.remove("show");
  }

  async function approveItem(itemId) {
    if (!confirm("確定審核通過這筆物品嗎?通過後會公開讓使用者搜尋比對。")) return;
    await callActionApi(itemId, `${API_BASE}/items/${itemId}/approve`, "open");
  }

  async function rejectItem(itemId) {
    if (!confirm("確定要拒絕這筆物品嗎?")) return;
    await callActionApi(itemId, `${API_BASE}/items/${itemId}/reject`, "rejected");
  }

  async function callActionApi(itemId, url, newStatus) {
    const tr = document.querySelector(`tr[data-item-id="${itemId}"]`);
    const actionCell = tr ? tr.querySelector("td:last-child") : null;
    if (actionCell) actionCell.innerHTML = `<span style="color:#aaa;">處理中...</span>`;

    try {
      const res = await fetch(url, { method: "POST" });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || "操作失敗");

      // 目前篩選狀態如果就是「待審核」,審核後這筆會離開清單,直接從畫面移除
      const currentFilter = document.getElementById("filterStatus").value;
      if (currentFilter === "pending" && tr) {
        tr.remove();
        delete itemsCache[itemId];
        rawItemsList = rawItemsList.filter(i => i.id !== itemId);
        updatePendingBadge();
        if (Object.keys(itemsCache).length === 0) {
          document.getElementById("itemsBody").innerHTML =
            `<tr><td colspan="8" style="text-align:center;color:#888;">目前沒有符合條件的物品</td></tr>`;
        }
      } else if (itemsCache[itemId] && tr) {
        itemsCache[itemId].status = newStatus;
        fillRow(tr, itemsCache[itemId]);
      }
    } catch (err) {
      alert("操作失敗: " + err.message);
      if (tr && itemsCache[itemId]) fillRow(tr, itemsCache[itemId]);
    }
  }

  function updatePendingBadge() {
    const badge = document.getElementById("pendingBadge");
    const count = Object.values(itemsCache).filter(i => i.status === "pending").length;
    badge.textContent = count > 0 ? `${count} 筆待審核` : "";
    badge.className = count > 0 ? "pending-badge" : "";
  }

  async function updateStatus(itemId, newStatus) {
    if (!confirm("確定要將這筆物品標記為已結案嗎?")) return;

    // 先在畫面上立刻反映(樂觀更新),按鈕暫時失能避免重複點擊
    const tr = document.querySelector(`tr[data-item-id="${itemId}"]`);
    const actionCell = tr ? tr.querySelector("td:last-child") : null;
    if (actionCell) actionCell.innerHTML = `<span style="color:#aaa;">更新中...</span>`;

    const formData = new FormData();
    formData.append("status", newStatus);

    try {
      const res = await fetch(`${API_BASE}/items/${itemId}`, {
        method: "PATCH",
        body: formData,
      });
      if (!res.ok) throw new Error("更新失敗");

      // 成功後,更新本地快取,並只重繪這一列,不重新打整個 /items
      if (itemsCache[itemId]) {
        itemsCache[itemId].status = newStatus;
        if (tr) fillRow(tr, itemsCache[itemId]);
      } else {
        loadItems(); // 保險起見,若本地找不到這筆快取就整頁重抓
      }
    } catch (err) {
      alert("更新失敗: " + err.message);
      if (tr) fillRow(tr, itemsCache[itemId]); // 還原原本畫面
    }
  }

  // 頁面載入時自動抓一次資料
  loadItems();
</script>

<div class="modal-overlay" id="detailModal" onclick="if(event.target === this) closeDetail()">
  <div class="modal-box">
    <div class="modal-header">
      <h2 style="margin:0;font-size:16px;">AI 比對詳情</h2>
      <button class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div id="detailContent">載入中...</div>
  </div>
</div>

</body>
</html>
